name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Checkers + scoring
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: V3 reference solution passes its checker
        run: |
          mkdir -p /tmp/lb-ref/v3
          cp verify/reference_maze.py /tmp/lb-ref/v3/maze.py
          cd /tmp/lb-ref/v3 && python "$GITHUB_WORKSPACE/tasks/v3-viriato/verify.py"
      - name: Scoring runs on the committed results
        run: python score.py > /dev/null

  browser:
    name: Browser checkers (V1, V2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - run: make check-reference
